services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: care_concern
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d care_concern"]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "4000:4000"
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    command: sh -c "npx prisma migrate deploy && node dist/src/server.js"
volumes:
  postgres_data:
